<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Timeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="calendar.css">
</head>
<body>
<main class="board">
  <h2 class="ptitle" id="ptitle"></h2>
  <div class="head">
    <div class="title">
      <button class="nav" id="prev" aria-label="Previous month">&#8249;</button>
      <h1 id="mname">Month 1</h1>
      <button class="nav" id="next" aria-label="Next month">&#8250;</button>
    </div>
    <div class="sub" id="range"></div>
  </div>
  <div class="bar">
    <button class="btn" id="settings">Settings</button>
    <button class="btn" id="backup">Backup</button>
  </div>
  <div id="rows"></div>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script src="calendar.js"></script>
<script src="app.js"></script>
</body>
</html>
